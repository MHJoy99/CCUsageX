<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Cost per prompt</title>
<desc id="d">Six example prompts ranked by API-equivalent cost, $4.12 down to $0.41, each column split into output, thinking, cache write, cache read and input token costs.</desc>
