<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">Tokens and cache: 96.1% cache hit rate and token mix</title>
  <desc id="d">Feature card for CCUsageX. A ring shows a 96.1% cache hit rate. Bars show the token mix over the last 30 days: cache read 174.2M, cache write 6.8M, output 1.42M, input 2.1K, out of 182.4M total. A callout reads Cache saved $612.80.</desc>

  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="r1"/>
      <stop offset="1" class="r2"/>
    </linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="k1"/>
      <stop offset="1" class="k2"/>
    </linearGradient>
  </defs>

  <style>
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .hair  { stroke: #d0d7de; stroke-width: 1; }
    .ttl   { fill: #1f2328; }
    .cap   { fill: #59636e; }
    .mut   { fill: #818b98; }
    .lbl   { fill: #1f2328; }
    .val   { fill: #1f2328; }
    .trk   { fill: #eaeef2; }
    .ringtrk { stroke: #eaeef2; }
    .ring  { stroke: url(#ring); }
    .white { fill: #ffffff; }
    .b-cr  { fill: #1baf7a; }
    .b-cw  { fill: #eda100; }
    .b-out { fill: #eb6834; }
    .b-in  { fill: #2a78d6; }
    .r1 { stop-color: #5b3df5; }
    .r2 { stop-color: #3a1d9e; }
    .k1 { stop-color: #5b3df5; }
    .k2 { stop-color: #3a1d9e; }
    .callout-bg { fill: url(#cg); }

    .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .sans  { font-family: -apple-system, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; }

    .ring { stroke-dasharray: 477.5; stroke-dashoffset: 18.6; animation: sweep 1.4s cubic-bezier(.4, 0, .2, 1) .15s both; }
    @keyframes sweep { from { stroke-dashoffset: 477.5; } to { stroke-dashoffset: 18.6; } }

    .pct { animation: fade .5s ease-out .5s both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .bar { transform-box: fill-box; transform-origin: 0% 50%; animation: grow .6s cubic-bezier(.2, .7, .2, 1) both; }
    .bar-1 { animation-delay: .4s; }
    .bar-2 { animation-delay: .5s; }
    .bar-3 { animation-delay: .6s; }
    .bar-4 { animation-delay: .7s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .callout { animation: rise .6s cubic-bezier(.2, .7, .2, 1) 1.25s both; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-color-scheme: dark) {
      .card  { fill: #0d1117; stroke: #30363d; }
      .hair  { stroke: #30363d; }
      .ttl   { fill: #e6edf3; }
      .cap   { fill: #9198a1; }
      .mut   { fill: #656c76; }
      .lbl   { fill: #e6edf3; }
      .val   { fill: #e6edf3; }
      .trk   { fill: #21262d; }
      .ringtrk { stroke: #21262d; }
      .b-cr  { fill: #199e70; }
      .b-cw  { fill: #c98500; }
      .b-out { fill: #d95926; }
      .b-in  { fill: #3987e5; }
      .r1 { stop-color: #9d8cff; }
      .r2 { stop-color: #6a4ff7; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- card -->
  <rect x="0.5" y="0.5" width="639" height="399" rx="12" class="card"/>

  <!-- header -->
  <text x="32" y="50" class="serif ttl" font-size="24" font-weight="600">Tokens &amp; cache</text>
  <text x="32" y="74" class="sans cap" font-size="13">Every token type, and what caching saved you</text>
  <line x1="32" y1="94" x2="608" y2="94" class="hair"/>

  <!-- left: cache hit ring -->
  <text x="32" y="136" class="sans cap" font-size="13" font-weight="600">Cache hit rate</text>
  <circle cx="150" cy="240" r="76" fill="none" stroke-width="16" class="ringtrk"/>
  <circle cx="150" cy="240" r="76" fill="none" stroke-width="16" stroke-linecap="round"
          transform="rotate(-90 150 240)" class="ring"/>
  <g class="pct">
    <text x="150" y="238" text-anchor="middle" class="sans ttl" font-size="30" font-weight="700">96.1%</text>
    <text x="150" y="260" text-anchor="middle" class="sans cap" font-size="13">cache hit</text>
  </g>

  <line x1="284" y1="118" x2="284" y2="340" class="hair"/>

  <!-- right: token mix -->
  <text x="300" y="136" class="sans cap" font-size="13" font-weight="600">Token mix, last 30 days</text>
  <text x="608" y="136" text-anchor="end" class="sans mut" font-size="12">182.4M total</text>

  <!-- row 1: cache read -->
  <text x="300" y="166" class="sans lbl" font-size="13">Cache read <tspan class="mut" font-size="12">95.5%</tspan></text>
  <text x="608" y="166" text-anchor="end" class="sans val" font-size="13" font-weight="600">174.2M</text>
  <rect x="300" y="174" width="308" height="10" rx="5" class="trk"/>
  <rect x="300" y="174" width="294" height="10" rx="5" class="bar bar-1 b-cr"/>

  <!-- row 2: cache write -->
  <text x="300" y="210" class="sans lbl" font-size="13">Cache write <tspan class="mut" font-size="12">3.7%</tspan></text>
  <text x="608" y="210" text-anchor="end" class="sans val" font-size="13" font-weight="600">6.8M</text>
  <rect x="300" y="218" width="308" height="10" rx="5" class="trk"/>
  <rect x="300" y="218" width="12" height="10" rx="5" class="bar bar-2 b-cw"/>

  <!-- row 3: output -->
  <text x="300" y="254" class="sans lbl" font-size="13">Output <tspan class="mut" font-size="12">0.8%</tspan></text>
  <text x="608" y="254" text-anchor="end" class="sans val" font-size="13" font-weight="600">1.42M</text>
  <rect x="300" y="262" width="308" height="10" rx="5" class="trk"/>
  <rect x="300" y="262" width="4" height="10" rx="2" class="bar bar-3 b-out"/>

  <!-- row 4: input -->
  <text x="300" y="298" class="sans lbl" font-size="13">Input <tspan class="mut" font-size="12">&lt;0.1%</tspan></text>
  <text x="608" y="298" text-anchor="end" class="sans val" font-size="13" font-weight="600">2.1K</text>
  <rect x="300" y="306" width="308" height="10" rx="5" class="trk"/>
  <rect x="300" y="306" width="4" height="10" rx="2" class="bar bar-4 b-in"/>

  <!-- callout -->
  <g class="callout">
    <rect x="300" y="328" width="308" height="40" rx="10" class="callout-bg"/>
    <text x="318" y="353" class="sans white" font-size="17" font-weight="700">Cache saved $612.80</text>
    <text x="590" y="353" text-anchor="end" class="sans white" font-size="11" opacity="0.85">API list price</text>
  </g>

  <text x="32" y="388" class="sans mut" font-size="11">Bars drawn to scale of 182.4M total; segments under 4px are padded for visibility.</text>
</svg>
