<circle class="num" cx="204" cy="188" r="12"/><text class="numT" x="204" y="193" text-anchor="middle">1</text><text class="ttl" x="60" y="240">Claude Code</text><text class="sub" x="60" y="261">CLI · VS Code</text>
<rect class="box" x="60" y="282" width="152" height="52" rx="9"/>
<text class="mono m" x="136" y="313" text-anchor="middle">&gt; your prompt</text>
