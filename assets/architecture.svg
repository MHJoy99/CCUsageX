<circle class="num" cx="444" cy="188" r="12"/><text class="numT" x="444" y="193" text-anchor="middle">2</text><text class="ttl" x="300" y="240">Transcripts</text><text class="sub" x="300" y="261">JSONL, one per session</text>
<rect class="box" x="300" y="282" width="152" height="52" rx="9"/>
<text class="mono m" x="376" y="304" text-anchor="middle">~/.claude/projects/</text>
<text class="mono m2" x="376" y="323" text-anchor="middle">**/*.jsonl</text>
</g>
<g>
