<text class="chipT" x="694" y="333" text-anchor="middle">price</text></g>
</g>
<g>
<rect class="card" x="812" y="150" width="184" height="200" rx="16"/>
<rect class="tile" x="828" y="166" width="44" height="44" rx="12"/><g class="ic" transform="translate(812,150)"><path d="M28 31 V45 A10 4 0 0 0 48 45 V31 M28 38 A10 4 0 0 0 48 38"/><ellipse cx="38" cy="31" rx="10" ry="4"/></g>
<circle class="num" cx="972" cy="188" r="12"/><text class="numT" x="972" y="193" text-anchor="middle">4</text><text class="ttl" x="828" y="240">Local store</text><text class="sub" x="828" y="261">Its own copy</text>
<rect class="box" x="828" y="282" width="152" height="52" rx="9"/>
<text class="mono m" x="904" y="304" text-anchor="middle">~/.ccusagex/</text>
<text class="mono m2" x="904" y="323" text-anchor="middle">store.json</text>
</g>
<g>
<rect class="card" x="1052" y="150" width="184" height="200" rx="16"/>
<rect class="tile" x="1068" y="166" width="44" height="44" rx="12"/><g class="ic" transform="translate(1052,150)"><rect x="27" y="28" width="22" height="20" rx="3"/><path d="M27 34 H49 M32 44 V40 M38 44 V37 M44 44 V41"/></g>
<circle class="num" cx="1212" cy="188" r="12"/><text class="numT" x="1212" y="193" text-anchor="middle">5</text><text class="ttl" x="1068" y="240">Dashboard</text><text class="sub" x="1068" y="261">Browser or Edge app</text>
<rect class="box" x="1068" y="282" width="152" height="52" rx="9"/>
<circle class="live" cx="1083" cy="303" r="4"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
<text class="mono m" x="1094" y="308">127.0.0.1:3020</text>
<text class="mono m2" x="1094" y="325">local only</text>
</g>

<path class="flow" d="M232 250 H271"/>
<path class="head" d="M271 244 L280 250 L271 256 Z"/>
<text class="lbl" x="256" y="236" text-anchor="middle">writes</text>
<path class="flow" d="M472 250 H511"/>
<path class="head" d="M511 244 L520 250 L511 256 Z"/>
<text class="lbl" x="496" y="236" text-anchor="middle">reads</text>
<path class="flow" d="M760 250 H799"/>
<path class="head" d="M799 244 L808 250 L799 256 Z"/>
<text class="lbl" x="784" y="236" text-anchor="middle">saves</text>
<path class="flow" d="M1000 250 H1039"/>
<path class="head" d="M1039 244 L1048 250 L1039 256 Z"/>
<text class="lbl" x="1024" y="236" text-anchor="middle">serves</text>

<text class="cap" x="136" y="382" text-anchor="middle">Logs every session</text>
<text class="cap" x="136" y="402" text-anchor="middle">as you work, in the</text>
<text class="cap" x="136" y="422" text-anchor="middle">terminal or VS Code.</text>
<text class="cap" x="376" y="382" text-anchor="middle">Plain-text logs.</text>
<text class="cap" x="376" y="402" text-anchor="middle">Opened read-only,</text>
<text class="cap" x="376" y="422" text-anchor="middle">never modified.</text>
<text class="cap" x="640" y="382" text-anchor="middle">Incremental scan every 5 s.</text>
<text class="cap" x="640" y="402" text-anchor="middle">Requests tied to your prompt,</text>
<text class="cap" x="640" y="422" text-anchor="middle">subagents included. Priced</text>
<text class="cap" x="640" y="442" text-anchor="middle">from config.json.</text>
<text class="cap" x="904" y="382" text-anchor="middle">Keeps history after</text>
<text class="cap" x="904" y="402" text-anchor="middle">Claude Code’s 30-day</text>
<text class="cap" x="904" y="422" text-anchor="middle">transcript cleanup.</text>
<text class="cap" x="1144" y="382" text-anchor="middle">JSON API + web UI,</text>
<text class="cap" x="1144" y="402" text-anchor="middle">bound to 127.0.0.1</text>
<text class="cap" x="1144" y="422" text-anchor="middle">only.</text>

