<rect class="tileHi" x="540" y="166" width="44" height="44" rx="12"/><g class="icHi" transform="translate(524,150)"><rect x="28" y="27" width="20" height="9" rx="2.5"/><rect x="28" y="40" width="20" height="9" rx="2.5"/><path d="M33 31.5 h.01 M33 44.5 h.01"/></g>
<circle class="numHi" cx="732" cy="188" r="12"/><text class="numHiT" x="732" y="193" text-anchor="middle">3</text><text class="ttlHi" x="540" y="240">CCUsageX server</text><text class="subHi" x="540" y="261">node server.js</text>
