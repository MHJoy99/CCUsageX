<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
<title id="t">How CCUsageX works</title>
<desc id="d">Claude Code, in the CLI or VS Code, writes transcript files to ~/.claude/projects. The CCUsageX server reads them read-only, scans every 5 seconds, dedupes by message and request id, attributes requests to your prompt and prices them. Results are kept in a local store at ~/.ccusagex/store.json and served as a dashboard on 127.0.0.1:3020. Everything stays on your machine; nothing is sent to any cloud.</desc>
<style>
:root{--bg:#ffffff;--zone:rgba(91,61,245,.045);--card:#f6f8fa;--line:#d0d7de;--t:#1f2328;--t2:#59636e;--t3:#818b98;--acc:#5b3df5;--soft:rgba(91,61,245,.11);--flow:#5b3df5;--bad:#d03b3b;--good:#0ca30c;--bd:#8a7bef}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--zone:rgba(144,133,233,.07);--card:#161b22;--line:#30363d;--t:#e6edf3;--t2:#9198a1;--t3:#656c76;--acc:#9085e9;--soft:rgba(144,133,233,.16);--flow:#b3a8ff;--bad:#e66767;--good:#2fc92f;--bd:#7467d6}}
text{font-family:-apple-system,'Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;fill:var(--t)}
.ttl,.ttlHi,.h1{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.h1{font-size:28px;font-weight:700}
.h2{font-size:15px;fill:var(--t2)}
.bg{fill:var(--bg);stroke:var(--line)}
.zone{fill:var(--zone);stroke:var(--bd);stroke-width:1.6;stroke-dasharray:7 6}
.zlabelbg{fill:var(--bg);stroke:var(--bd);stroke-width:1.4}
.zlabel{font-size:14px;font-weight:700;letter-spacing:.06em;fill:var(--acc)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.srv{fill:url(#grad);stroke:#7b61ff;stroke-width:1.2}
.tile{fill:var(--soft)}.tileHi{fill:rgba(255,255,255,.16)}
.ic{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icHi{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ttl{font-size:20px;font-weight:700}.ttlHi{font-size:20px;font-weight:700;fill:#fff}
.sub{font-size:14px;fill:var(--t2)}.subHi{font-size:14px;fill:rgba(255,255,255,.78)}
.box{fill:var(--bg);stroke:var(--line)}
.m{font-size:13px;fill:var(--t)}.m2{font-size:13px;fill:var(--t2)}
.chip{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.3)}
.chipHi{fill:rgba(255,255,255,.4)}
.chipT{font-size:14px;font-weight:600;fill:#fff}
.num{fill:var(--acc)}.numT{font-size:13px;font-weight:700;fill:var(--bg)}
.numHi{fill:#fff}.numHiT{font-size:13px;font-weight:700;fill:#3a1d9e}
.flow{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 6;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-11}}
.head{fill:var(--acc)}
.lbl{font-size:13px;font-weight:600;fill:var(--t2)}
.cap{font-size:14px;fill:var(--t2)}
.no{fill:none;stroke:var(--t3);stroke-width:1.8;stroke-dasharray:4 5;stroke-linecap:round}
.cloud{fill:none;stroke:var(--t3);stroke-width:2.2;stroke-linejoin:round}
.xbg{fill:var(--bg);stroke:var(--bad);stroke-width:2}
.x{stroke:var(--bad);stroke-width:2.6;stroke-linecap:round}
.nolbl{font-size:15px;font-weight:600;fill:var(--t2)}
.live{fill:var(--good)}
.lg{font-size:13px;fill:var(--t2)}
.halo0{stop-color:var(--flow);stop-opacity:.7}.halo1{stop-color:var(--flow);stop-opacity:0}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.pkt{display:none}}
</style>
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset=".55" stop-color="#3a1d9e"/><stop offset="1" stop-color="#1b0b4a"/></linearGradient>
<radialGradient id="halo"><stop class="halo0" offset="0"/><stop class="halo1" offset="1"/></radialGradient>
<g id="pk"><circle r="14" fill="url(#halo)"/><circle r="4.6" fill="var(--flow)"/><circle r="1.7" fill="#fff"/></g>
</defs>
<rect class="bg" x=".6" y=".6" width="1278.8" height="558.8" rx="18"/>
<text class="h1" x="44" y="50">How it works</text>
<text class="h2" x="44" y="76">Read-only · local · zero dependencies</text>

<path class="cloud" d="M614 64 H668 A12 12 0 0 0 670 40.2 A18 18 0 0 0 636 34 A14 14 0 0 0 614 64 Z"/>
<text class="nolbl" x="700" y="55">No cloud. No telemetry. No account.</text>
<path class="no" d="M641 146 V66"/>
<rect class="zone" x="20" y="100" width="1240" height="440" rx="22"/>
<circle class="xbg" cx="641" cy="100" r="12"/><path class="x" d="M636 95 L646 105 M646 95 L636 105"/>
<rect class="zlabelbg" x="44" y="86" width="372" height="28" rx="14"/>
<g class="ic" style="stroke-width:2"><path d="M63 99 v-3 a4 4 0 0 1 8 0 v3"/><rect x="61" y="99" width="12" height="9" rx="2"/></g>
<text class="zlabel" x="86" y="105">YOUR MACHINE — NOTHING LEAVES IT</text>

<g>
