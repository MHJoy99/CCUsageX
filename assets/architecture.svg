<rect class="chipHi" x="644" y="280" width="100" height="28" rx="14" opacity="0"><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;0;.85;0;0;.85;0;0" keyTimes="0;0.11;0.14;0.17;0.61;0.64;0.67;1"/></rect>
<text class="chipT" x="694" y="299" text-anchor="middle">dedupe</text></g>
<g><rect class="chip" x="536" y="314" width="100" height="28" rx="14"/>
<rect class="chipHi" x="536" y="314" width="100" height="28" rx="14" opacity="0"><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;0;.85;0;0;.85;0;0" keyTimes="0;0.18;0.21;0.24;0.68;0.71;0.74;1"/></rect>
