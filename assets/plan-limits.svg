<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
<title id="t">Plan limits</title>
<desc id="d">Two example gauges. Session, 5-hour window: 23% used, resets in 2h 14m, on pace, about 42% at reset. Weekly, 7-day window: 41% used, resets Thursday, on pace, about 68% at reset. Each has a small history sparkline.</desc>
<style>
:root{--bg:#ffffff;--card:#f6f8fa;--line:#d0d7de;--t:#1f2328;--t2:#59636e;--ok:#1baf7a;--warn:#eda100;--hi:#e5484d;--trk:#e6e9ed;--spk:#6250d6}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--t:#e6edf3;--t2:#9198a1;--ok:#199e70;--warn:#c98500;--hi:#e66767;--trk:#262c36;--spk:#9085e9}}
text{font-family:-apple-system,'Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;fill:var(--t)}
.bg{fill:var(--bg);stroke:var(--line)}
.h1{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;font-size:30px;font-weight:700}
.h2{font-size:17px;fill:var(--t2)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.track{fill:none;stroke:var(--trk);stroke-width:16}
.ring{fill:none;stroke:var(--ok);stroke-width:16;stroke-linecap:round;stroke-dasharray:100;animation:fill 1.8s cubic-bezier(.22,.8,.3,1) backwards}
.pct{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;animation:fade .6s ease-out backwards}
.pl{font-size:15px;fill:var(--t2)}
.gl{font-size:20px;font-weight:700}
.rs{font-size:26px;font-weight:600}
.pace{font-size:17px;font-weight:600;fill:var(--ok)}
.okd{fill:var(--ok)}
.sub{font-size:16px;fill:var(--t2)}
.spark{fill:none;stroke:var(--spk);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:draw 1.6s ease-out backwards}
.area{fill:var(--spk);opacity:.1;animation:fade2 .8s ease-out backwards}
.sdot{fill:var(--spk);animation:fade .4s ease-out backwards}
.blk{animation:rise .7s cubic-bezier(.22,.8,.3,1) backwards}
.live{fill:var(--ok)}
.halo{fill:var(--ok);transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.lg{font-size:15px;fill:var(--t2)}
.d-ok{fill:var(--ok)}.d-w{fill:var(--warn)}.d-h{fill:var(--hi)}
@keyframes fill{from{stroke-dashoffset:100}}
@keyframes draw{from{stroke-dashoffset:100}}
@keyframes fade{from{opacity:0}}
@keyframes fade2{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.halo{display:none}}
</style>
<rect class="bg" x=".5" y=".5" width="1279" height="479" rx="14"/>
<text class="h1" x="40" y="58">Plan limits</text>
<text class="h2" x="40" y="86">How much of your Claude plan window is used, and when it resets.</text>
<circle class="halo" cx="1150" cy="52" r="6"/><circle class="live" cx="1150" cy="52" r="6"/>
<text class="lg" x="1166" y="58">live</text>
<g class="blk" style="animation-delay:0s">
<rect class="card" x="40" y="100" width="580" height="310" rx="12"/>
<circle class="track" cx="150" cy="225" r="70"/>
<circle class="ring r1" cx="150" cy="225" r="70" pathLength="100" transform="rotate(-90 150 225)" style="stroke-dashoffset:77;animation-delay:0.15s"/>
<text class="pct" x="150" y="234" text-anchor="middle" style="animation-delay:0.5s">23%</text>
<text class="pl" x="150" y="259" text-anchor="middle">used</text>
<text class="gl" x="265" y="162">Session · 5-hour</text>
<text class="rs" x="265" y="200">resets in 2h 14m</text>
<circle class="okd" cx="273" cy="235" r="6"/>
<text class="pace" x="290" y="241">on pace</text>
<text class="sub" x="265" y="272">At this pace ~42% at reset</text>
<text class="sub" x="70" y="336">History · last 24 h</text>
<path class="area" d="M70 379 L122 376 L174 374 L226 370 L278 371 L330 367 L382 362 L434 364 L486 358 L538 355 L590 350 L590 391 L70 391Z" style="animation-delay:0.9s"/>
<path class="spark" d="M70 379 L122 376 L174 374 L226 370 L278 371 L330 367 L382 362 L434 364 L486 358 L538 355 L590 350" pathLength="100" style="animation-delay:0.5s"/>
<circle class="sdot" cx="590" cy="350" r="4.5" style="animation-delay:1.8s"/>
</g>
<g class="blk" style="animation-delay:0.25s">
<rect class="card" x="660" y="100" width="580" height="310" rx="12"/>
<circle class="track" cx="770" cy="225" r="70"/>
<circle class="ring r2" cx="770" cy="225" r="70" pathLength="100" transform="rotate(-90 770 225)" style="stroke-dashoffset:59;animation-delay:0.4s"/>
<text class="pct" x="770" y="234" text-anchor="middle" style="animation-delay:0.75s">41%</text>
<text class="pl" x="770" y="259" text-anchor="middle">used</text>
<text class="gl" x="885" y="162">Weekly · 7-day</text>
<text class="rs" x="885" y="200">resets Thu</text>
<circle class="okd" cx="893" cy="235" r="6"/>
<text class="pace" x="910" y="241">on pace</text>
<text class="sub" x="885" y="272">At this pace ~68% at reset</text>
<text class="sub" x="690" y="336">History · last 24 h</text>
<path class="area" d="M690 381 L742 377 L794 375 L846 373 L898 369 L950 366 L1002 364 L1054 359 L1106 357 L1158 353 L1210 350 L1210 391 L690 391Z" style="animation-delay:1.15s"/>
<path class="spark" d="M690 381 L742 377 L794 375 L846 373 L898 369 L950 366 L1002 364 L1054 359 L1106 357 L1158 353 L1210 350" pathLength="100" style="animation-delay:0.75s"/>
<circle class="sdot" cx="1210" cy="350" r="4.5" style="animation-delay:2.05s"/>
</g>
<g transform="translate(40 450)"><circle class="d-ok" cx="6" cy="-5" r="6"/><text class="lg" x="20" y="0">ok</text>
<circle class="d-w" cx="75" cy="-5" r="6"/><text class="lg" x="89" y="0">watch from 70%</text>
<circle class="d-h" cx="235" cy="-5" r="6"/><text class="lg" x="249" y="0">high from 90%</text></g>
<text class="lg" x="1240" y="450" text-anchor="end">Example values</text>
</svg>