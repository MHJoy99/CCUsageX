; Claude Pulse - the CCUsageX desktop widget for Rainmeter.
; Shows peak / heavy hours and Claude plan usage. The UI is public/widget.html, served by your local CCUsageX.
; Needs: the NSTechBytes WebView2 plugin (scripts/install-widget.ps1 installs it) and CCUsageX running locally.
; The page reports its own height back to this skin (it sets H), so compact/expanded modes resize the window.
; Change the port below if you run CCUsageX on another one (config.json "port" or CCU_PORT).
[Rainmeter]
Update=2000
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=Claude Pulse
Author=CCUsageX contributors
Information=Claude peak/heavy-hours clock and plan usage as an animated glass widget (CCUsageX).
License=MIT
Version=1.4.0

[Variables]
Port=3020
W=348
H=560
PageUrl=http://127.0.0.1:#Port#/widget.html

[WebView2]
Measure=Plugin
Plugin=WebView2
URL=#PageUrl#
X=0
Y=0
W=#W#
H=#H#
Clickthrough=0
DynamicVariables=1
ZoomControl=0
AssistiveFeatures=0
NewWindow=0
; load only once CCUsageX answers (it may start after Rainmeter at logon): see [Probe]
AutoStart=0

[Probe]
Measure=WebParser
URL=#PageUrl#
RegExp=(?siU)^(.*)$
UpdateRate=3
FinishAction=[!DisableMeasure Probe][!CommandMeasure WebView2 "WebView Start"]

[Bg]
Meter=Image
W=#W#
H=#H#
SolidColor=0,0,0,1
DynamicVariables=1
