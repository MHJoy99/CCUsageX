name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # node --check accepts one file per call (extra arguments are ignored), so check each file separately.
      - name: Syntax check
        run: node --check server.js && node --check public/app.js && node --check public/charts.js

      # Name the file: `node --test test` does not work on newer Node versions.
      - name: Test
        run: node --test test/server.test.js
